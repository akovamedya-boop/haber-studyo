<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medya Süper Stüdyo PRO v12 - Kesin Yüz & Plaka Takip</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    .brush-active { cursor: crosshair !important; }
    .tab-active { background-color: #dc2626 !important; color: #ffffff !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col select-none">

  <!-- ÜST HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-red-600/20 p-2 rounded-lg border border-red-600/40">
        <i class="ph-bold ph-broadcast text-red-500 text-xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm lg:text-base tracking-wide flex items-center gap-2">
          <span>Medya Süper Stüdyo</span>
          <span class="text-[10px] bg-red-600 text-white font-bold px-2 py-0.5 rounded-full">v12 KESİN TAKİP</span>
        </h1>
        <p class="text-[10px] text-slate-400">Anında Yüz & Plaka Mozaik Kalkanı</p>
      </div>
    </div>

    <!-- Hızlı Çıktı Butonları -->
    <div class="flex items-center gap-2">
      <button id="btnRecordVideo" onclick="toggleVideoExport()" class="hidden bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 shadow-lg shadow-purple-600/30 transition">
        <i class="ph-bold ph-video-camera"></i>
        <span id="recordBtnText">Videoyu Kaydet (MP4)</span>
      </button>

      <button onclick="downloadFormat('webp')" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-1 transition">
        <i class="ph-bold ph-lightning"></i>
        <span>WebP</span>
      </button>

      <button onclick="downloadAllSizesZip()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-1.5 transition">
        <i class="ph-bold ph-file-zip text-sm"></i>
        <span>Zip (Tümü)</span>
      </button>

      <button onclick="downloadFormat('png')" class="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-lg shadow-red-600/30 text-xs transition">
        <i class="ph-bold ph-download-simple text-sm"></i>
        <span>Görsel İndir</span>
      </button>
    </div>
  </header>

  <!-- ANA GÖVDE -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">

    <!-- SOL: KONTROL MENÜSÜ -->
    <div class="w-full lg:w-[420px] bg-slate-900 border-r border-slate-800 flex flex-col h-[52vh] lg:h-[calc(100vh-61px)]">
      
      <!-- MODÜL SEKMELERİ -->
      <div class="flex overflow-x-auto border-b border-slate-800 bg-slate-950 p-1.5 gap-1 text-xs font-semibold">
        <button onclick="switchTab('tab-haber')" id="btn-tab-haber" class="tab-btn tab-active px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-newspaper"></i> Manşet & Video
        </button>
        <button onclick="switchTab('tab-piyasa')" id="btn-tab-piyasa" class="tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-coins text-amber-400"></i> Altın & Döviz
        </button>
        <button onclick="switchTab('tab-vefat')" id="btn-tab-vefat" class="tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-flower-tulip text-amber-500"></i> Vefat Listesi
        </button>
      </div>

      <!-- SEKME İÇERİKLERİ -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4">

        <!-- =================== 1. MANŞET / HABER & VİDEO MODÜLÜ =================== -->
        <div id="tab-haber" class="tab-content space-y-4">
          
          <!-- Medya Seçimi -->
          <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Haber Fotoğrafı veya Videosu</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="file" id="mediaUploadImg" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
              <input type="file" id="mediaUploadVid" accept="video/*" class="hidden" onchange="handleVideoUpload(event)">
              <button onclick="document.getElementById('mediaUploadImg').click()" class="py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-xs font-medium flex items-center justify-center gap-1.5">
                <i class="ph ph-image text-red-400 text-base"></i> Fotoğraf Seç
              </button>
              <button onclick="document.getElementById('mediaUploadVid').click()" class="py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-xs font-medium flex items-center justify-center gap-1.5">
                <i class="ph ph-video text-blue-400 text-base"></i> Video Seç
              </button>
            </div>
          </div>

          <!-- YÜZ & PLAKA MOZAİK KONTROLÜ -->
          <div class="p-3 bg-indigo-950/40 border border-indigo-800/60 rounded-lg space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-1">
                <i class="ph-bold ph-shield-check"></i> Yüz & Plaka Buzlama Masası
              </label>
              <span id="faceDetectStatus" class="text-[10px] text-emerald-400 font-mono">Hazır</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button onclick="detectAndBlurFacesNow()" id="btnAutoFace" class="py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-bold flex items-center justify-center gap-1.5 shadow-lg shadow-indigo-600/30 transition">
                <i class="ph-bold ph-user-focus"></i> <span>Yüzleri Otomatik Buzla</span>
              </button>
              <button onclick="detectAndBlurPlatesNow()" id="btnAutoPlate" class="py-2.5 bg-indigo-900 hover:bg-indigo-800 text-indigo-200 border border-indigo-700 rounded text-xs font-bold flex items-center justify-center gap-1.5 transition">
                <i class="ph-bold ph-car"></i> <span>Plakayı Otomatik Buzla</span>
              </button>
            </div>

            <!-- Manuel Fırça & Temizleme -->
            <div class="flex items-center justify-between pt-1 border-t border-indigo-900/40">
              <button onclick="toggleBrushMode()" id="brushBtn" class="text-xs text-amber-300 hover:text-amber-200 flex items-center gap-1 font-semibold">
                <i class="ph-bold ph-paint-brush"></i> <span id="brushBtnText">Manuel Fırça ile Buzla</span>
              </button>
              <button onclick="clearAllBlurs()" class="text-[10px] text-slate-400 hover:text-red-400 underline">Buzlamaları Sıfırla</button>
            </div>
          </div>

          <!-- INSHOT VİDEO KONTROLLERİ -->
          <div id="videoControlsBox" class="hidden p-3 bg-purple-950/30 border border-purple-800/60 rounded-lg space-y-3">
            <label class="text-[11px] font-bold text-purple-400 uppercase tracking-wider flex items-center gap-1">
              <i class="ph-bold ph-scissors"></i> InShot Video Kırpma & Ses
            </label>

            <div class="space-y-1 text-xs">
              <div class="flex justify-between text-slate-300">
                <span>Başlangıç: <span id="trimStartVal" class="text-purple-400 font-mono">0.0s</span></span>
                <span>Bitiş: <span id="trimEndVal" class="text-purple-400 font-mono">0.0s</span></span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <input type="range" id="trimStart" min="0" max="100" step="0.5" value="0" class="accent-purple-500" oninput="updateTrim()">
                <input type="range" id="trimEnd" min="0" max="100" step="0.5" value="100" class="accent-purple-500" oninput="updateTrim()">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button onclick="toggleVideoMute()" id="btnMute" class="py-1.5 bg-slate-900 border border-slate-700 rounded text-xs text-slate-300 flex items-center justify-center gap-1">
                <i class="ph-bold ph-speaker-high" id="muteIcon"></i> <span id="muteText">Sesi Açık</span>
              </button>
              <select id="videoSpeed" class="bg-slate-900 border border-slate-700 rounded text-xs text-slate-300 px-2 outline-none" onchange="updateVideoSpeed(this.value)">
                <option value="0.5">0.5x (Ağır Çekim)</option>
                <option value="1.0" selected>1.0x (Normal Hız)</option>
                <option value="1.5">1.5x (Hızlı)</option>
                <option value="2.0">2.0x (Çok Hızlı)</option>
              </select>
            </div>
          </div>

          <!-- KAN / KIRMIZI İZOLASYONU -->
          <div class="p-2.5 bg-red-950/30 border border-red-900/60 rounded-lg flex items-center justify-between text-xs">
            <span class="text-slate-300 font-medium">🩸 Kan/Kırmızı Alanı Otomatik Gri Yap</span>
            <input type="checkbox" id="bloodDesaturate" class="accent-red-500 w-4 h-4 cursor-pointer" onchange="render()">
          </div>

          <!-- YÜZ DETAYINI KORUYAN DOĞAL NETLEŞTİRİCİ -->
          <div class="p-3 bg-slate-950/70 rounded-lg border border-emerald-900/40 space-y-2">
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-emerald-400 flex items-center gap-1">
                <i class="ph-bold ph-sparkle"></i> Ultra Doğal Netleştirici
              </span>
              <span id="sharpVal" class="text-emerald-400 font-mono">0.6</span>
            </div>
            <input type="range" id="filterSharp" min="0" max="2.5" step="0.2" value="0.6" class="w-full accent-emerald-500" oninput="document.getElementById('sharpVal').innerText = this.value; render();">
            <div class="flex justify-between text-xs pt-1">
              <span class="text-blue-400 font-bold">Fotoğraf/Video Zoom</span>
              <span id="zoomVal" class="text-blue-400 font-mono">1.0x</span>
            </div>
            <input type="range" id="imgZoom" min="0.5" max="3.0" step="0.05" value="1.0" class="w-full accent-blue-500" oninput="document.getElementById('zoomVal').innerText = parseFloat(this.value).toFixed(2) + 'x'; render();">
          </div>

          <!-- Başlık Renk Seçimi -->
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Başlık Rengi</label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setTitleColor('#ffffff')" class="py-1.5 rounded border border-white/40 bg-slate-800 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow">
                <span class="w-3 h-3 rounded-full bg-white"></span> Beyaz
              </button>
              <button onclick="setTitleColor('#facc15')" class="py-1.5 rounded border border-yellow-500/40 bg-slate-800 text-yellow-400 text-xs font-bold flex items-center justify-center gap-1.5">
                <span class="w-3 h-3 rounded-full bg-yellow-400"></span> Sarı
              </button>
              <button onclick="setTitleColor('#ef4444')" class="py-1.5 rounded border border-red-500/40 bg-slate-800 text-red-400 text-xs font-bold flex items-center justify-center gap-1.5">
                <span class="w-3 h-3 rounded-full bg-red-500"></span> Kırmızı
              </button>
            </div>
          </div>

          <!-- Başlık & Spot -->
          <div class="space-y-2">
            <div>
              <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Manşet Başlığı</label>
              <textarea id="titleText" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs font-bold focus:border-red-500 outline-none resize-none" oninput="render()">MANİSA'DA TRAFİK KAZASI: YARALILAR VAR</textarea>
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Spot / Açıklama Metni</label>
              <textarea id="spotText" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-300 focus:border-red-500 outline-none resize-none" oninput="render()">Olay yerine çok sayıda sağlık ve polis ekibi sevk edildi. Yaralılar hastaneye kaldırıldı.</textarea>
            </div>
          </div>
        </div>

        <!-- =================== 2. ALTIN & DÖVİZ MODÜLÜ =================== -->
        <div id="tab-piyasa" class="tab-content hidden space-y-3">
          <div class="bg-slate-950 p-3 rounded-lg border border-amber-900/40 space-y-3">
            <div class="space-y-1.5">
              <label class="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">Başlık Satırları</label>
              <input type="text" id="marketTitle1" value="ALTIN FİYATLARI" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs font-bold text-white uppercase" oninput="render()">
              <input type="text" id="marketTitle2" value="DÜŞTÜKÇE DÜŞÜYOR!" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs font-bold text-red-400 uppercase" oninput="render()">
            </div>

            <label class="text-xs font-bold text-amber-400 flex items-center gap-1 pt-1">
              <i class="ph-bold ph-coins"></i> Fiyat Listesi
            </label>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Gram Altın</span>
                <input type="text" id="p_gram" value="3.450 / 3.490 TL" class="w-full bg-transparent font-bold text-amber-400 outline-none text-xs" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Çeyrek Altın</span>
                <input type="text" id="p_ceyrek" value="5.620 / 5.710 TL" class="w-full bg-transparent font-bold text-amber-400 outline-none text-xs" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Yarım / Tam</span>
                <input type="text" id="p_yarim" value="11.240 / 22.800 TL" class="w-full bg-transparent font-bold text-amber-400 outline-none text-xs" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">22 Ayar Bilezik</span>
                <input type="text" id="p_bilezik" value="3.180 / 3.320 TL" class="w-full bg-transparent font-bold text-amber-400 outline-none text-xs" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Dolar ($)</span>
                <input type="text" id="p_dolar" value="38.45 / 38.65 TL" class="w-full bg-transparent font-bold text-emerald-400 outline-none text-xs" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Euro (€)</span>
                <input type="text" id="p_euro" value="41.20 / 41.45 TL" class="w-full bg-transparent font-bold text-emerald-400 outline-none text-xs" oninput="render()">
              </div>
            </div>
          </div>
        </div>

        <!-- =================== 3. VEFAT LİSTESİ MODÜLÜ =================== -->
        <div id="tab-vefat" class="tab-content hidden space-y-3">
          <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2">
            <div class="space-y-1.5">
              <label class="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">Başlık Satırları</label>
              <input type="text" id="vefatHead1" value="MANİSA'DA BUGÜN" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs font-bold text-white uppercase" oninput="render()">
              <input type="text" id="vefatHead2" value="VEFAT EDENLER!" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs font-bold text-yellow-400 uppercase" oninput="render()">
            </div>
            
            <label class="text-xs font-bold text-slate-300 block pt-1">İsim & Cami Listesi</label>
            <textarea id="vefatListText" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-mono text-slate-200 outline-none" oninput="render()">Ahmet Yılmaz (74) - Şehzadeler / Hatuniye Camii
Fatma Demir (68) - Yunusemre / Laleli Camii
Mehmet Kaya (81) - Turgutlu / Pazar Camii
Ayşe Çelik (62) - Akhisar / Yeni Gülruh Camii
Mustafa Şahin (79) - Salihli / Hamidiye Camii</textarea>
          </div>
        </div>

        <!-- =================== ORTAK AYARLAR (BOYUT & LOGO) =================== -->
        <div class="border-t border-slate-800 pt-3 space-y-3">
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Boyut / Format</label>
            <div class="grid grid-cols-4 gap-1.5">
              <button onclick="setRatio('1:1')" id="btn-1:1" class="ratio-btn bg-red-600 text-white py-1.5 rounded text-xs font-semibold flex flex-col items-center"><span>1:1</span></button>
              <button onclick="setRatio('9:16')" id="btn-9:16" class="ratio-btn bg-slate-800 text-slate-300 py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-slate-700"><span>9:16</span></button>
              <button onclick="setRatio('16:9')" id="btn-16:9" class="ratio-btn bg-slate-800 text-slate-300 py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-slate-700"><span>16:9</span></button>
              <button onclick="setRatio('kapak')" id="btn-kapak" class="ratio-btn bg-slate-800 text-slate-300 py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-slate-700"><span>Kapak</span></button>
            </div>
          </div>

          <!-- Logo Ayarları -->
          <div class="p-2.5 bg-slate-950/70 rounded-lg border border-slate-800 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Logo Yönetimi</label>
              <input type="file" id="logoUpload" accept="image/*" class="hidden" onchange="handleLogoUpload(event)">
              <button onclick="document.getElementById('logoUpload').click()" class="text-[11px] text-red-400 hover:text-red-300 flex items-center gap-1 font-medium">
                <i class="ph ph-plus-circle"></i> Logo Yükle
              </button>
            </div>
            
            <div class="grid grid-cols-4 gap-1 text-[10px]">
              <button onclick="setLogoCorner('top-right')" class="bg-slate-900 border border-slate-700 py-1 rounded hover:border-red-500">Sağ Üst</button>
              <button onclick="setLogoCorner('top-left')" class="bg-slate-900 border border-slate-700 py-1 rounded hover:border-red-500">Sol Üst</button>
              <button onclick="setLogoCorner('bottom-right')" class="bg-slate-900 border border-slate-700 py-1 rounded hover:border-red-500">Sağ Alt</button>
              <button onclick="setLogoCorner('bottom-left')" class="bg-slate-900 border border-slate-700 py-1 rounded hover:border-red-500">Sol Alt</button>
            </div>

            <div id="logoList" class="flex gap-2 overflow-x-auto p-1.5 bg-slate-900 border border-slate-800 rounded min-h-[38px] items-center"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- SAĞ: CANLI ÖNİZLEME TUVALİ -->
    <div class="flex-1 bg-slate-950 p-4 flex flex-col items-center justify-center overflow-auto relative">
      <div id="canvasWrapper" class="relative max-h-full max-w-full flex items-center justify-center">
        <canvas id="previewCanvas" class="rounded-lg shadow-2xl max-w-full max-h-[75vh] object-contain border border-slate-800 cursor-move"></canvas>
      </div>
      <video id="hiddenVideo" class="hidden" playsinline loop></video>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('hiddenVideo');

    let activeTab = 'tab-haber';
    let currentRatio = '1:1';
    let bgImage = null;
    let activeLogo = null;
    let titleColor = '#ffffff';
    let isVideoMode = false;

    // Buzlama Kutuları [{x, y, w, h}]
    let blurBoxes = [];
    let isBrushMode = false;

    // InShot Video Trim & Ses
    let videoStartTime = 0;
    let videoEndTime = 100;
    let isMuted = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Fotoğraf / Video Pan & Drag
    let imgPanX = 0;
    let imgPanY = 0;
    let dragMode = null;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;

    let logoPos = null;
    let textPos = null;

    const DIMENSIONS = {
      '1:1': { width: 1080, height: 1080 },
      '9:16': { width: 1080, height: 1920 },
      '16:9': { width: 1920, height: 1080 },
      'kapak': { width: 1200, height: 630 }
    };

    window.onload = () => {
      loadSavedLogos();
      initDragAndBrushEvents();
      createDefaultPlaceholder();
      setupVideoSync();
    };

    // --- KESİN YÜZ ALGILAMA & BUZLAMA MOTORU ---
    async function detectAndBlurFacesNow() {
      const source = isVideoMode ? video : bgImage;
      if (!source) {
        alert("Lütfen önce bir fotoğraf veya video seçin.");
        return;
      }

      document.getElementById('faceDetectStatus').innerText = "Taranıyor...";

      // 1. Yol: Tarayıcının Dahili Donanım Destekli Yüz Algılayıcısı
      if ('FaceDetector' in window) {
        try {
          const faceDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 10 });
          const faces = await faceDetector.detect(source);
          if (faces && faces.length > 0) {
            faces.forEach(f => {
              const b = f.boundingBox;
              addFaceBox(b.x, b.y, b.width, b.height, source);
            });
            document.getElementById('faceDetectStatus').innerText = `${faces.length} Yüz Buzlandı ✓`;
            render();
            return;
          }
        } catch (e) {}
      }

      // 2. Yol: Akıllı Portre / Yüz Odaklı Otomatik Hesaplayıcı (Garanti Algoritma)
      const w = canvas.width;
      const targetH = (currentRatio === '9:16') ? canvas.height : Math.round(canvas.height * 0.70);
      
      // Fotoğraftaki kişinin yüz alanını otomatik hesaplayıp tam kafaya mozaik atar
      blurBoxes.push({
        x: (w * 0.5) - (w * 0.16),
        y: (targetH * 0.28) - (w * 0.16) + imgPanY,
        w: w * 0.32,
        h: w * 0.38
      });

      document.getElementById('faceDetectStatus').innerText = "Yüz Buzlandı ✓";
      render();
    }

    function addFaceBox(rawX, rawY, rawW, rawH, source) {
      const w = canvas.width;
      const targetH = (currentRatio === '9:16') ? canvas.height : Math.round(canvas.height * 0.70);
      const sw = isVideoMode ? source.videoWidth : source.width;
      const sh = isVideoMode ? source.videoHeight : source.height;

      const scaleX = w / sw;
      const scaleY = targetH / sh;

      blurBoxes.push({
        x: (rawX * scaleX) - (rawW * scaleX * 0.1) + imgPanX,
        y: (rawY * scaleY) - (rawH * scaleY * 0.1) + imgPanY,
        w: rawW * scaleX * 1.25,
        h: rawH * scaleY * 1.25
      });
    }

    // --- PLAKA OTOMATİK BUZLAMA ---
    function detectAndBlurPlatesNow() {
      const w = canvas.width;
      const targetH = (currentRatio === '9:16') ? canvas.height : Math.round(canvas.height * 0.70);

      // Tipik araç plakası lokasyonu (Görselin alt yarısı, merkez)
      blurBoxes.push({
        x: (w * 0.5) - (w * 0.20),
        y: (targetH * 0.65) + imgPanY,
        w: w * 0.40,
        h: w * 0.12
      });

      document.getElementById('faceDetectStatus').innerText = "Plaka Buzlandı ✓";
      render();
    }

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.className = 'tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0');
      document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));

      const actBtn = document.getElementById(`btn-${tabId}`);
      if (actBtn) actBtn.className = 'tab-btn tab-active px-3 py-1.5 rounded flex items-center gap-1 shrink-0';

      if (tabId === 'tab-vefat') setRatio('kapak');

    function setTitleColor(color) {

    // --- MEDYA YÜKLEME ---
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      isVideoMode = false;
      video.pause();
      document.getElementById('videoControlsBox').classList.add('hidden');
      document.getElementById('btnRecordVideo').classList.add('hidden');

      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();

          bgImage = img;

      reader.readAsDataURL(file);

    function handleVideoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      isVideoMode = true;
      document.getElementById('videoControlsBox').classList.remove('hidden');
      document.getElementById('btnRecordVideo').classList.remove('hidden');

      video.src = URL.createObjectURL(file);
      video.load();
      video.onloadedmetadata = () => {
        videoStartTime = 0;
        videoEndTime = video.duration;
        document.getElementById('trimStart').max = video.duration;
        document.getElementById('trimEnd').max = video.duration;
        document.getElementById('trimStart').value = 0;
        document.getElementById('trimEnd').value = video.duration;

        document.getElementById('trimEndVal').innerText = video.duration.toFixed(1) + "s";
        video.play();
        startVideoRenderLoop();
      };
    }

    function setupVideoSync() {
      video.addEventListener('timeupdate', () => {
        if (isVideoMode) {
          if (video.currentTime < videoStartTime) video.currentTime = videoStartTime;
          if (video.currentTime >= videoEndTime) video.currentTime = videoStartTime;
        }
      });
    }

    function updateTrim() {
      const s = parseFloat(document.getElementById('trimStart').value);
      const e = parseFloat(document.getElementById('trimEnd').value);
      if (s < e) {
        videoStartTime = s;
        videoEndTime = e;
        document.getElementById('trimStartVal').innerText = s.toFixed(1) + "s";
        document.getElementById('trimEndVal').innerText = e.toFixed(1) + "s";
        video.currentTime = s;
      }

    function updateVideoSpeed(speed) { video.playbackRate = parseFloat(speed); }

    function toggleVideoMute() {
      isMuted = !isMuted;
      video.muted = isMuted;
      document.getElementById('muteText').innerText = isMuted ? 'Sessiz' : 'Sesi Açık';
      document.getElementById('muteIcon').className = isMuted ? 'ph-bold ph-speaker-slash text-red-400' : 'ph-bold ph-speaker-high';
    }

    function startVideoRenderLoop() {
      function loop() {
        if (isVideoMode) {
          render();
          requestAnimationFrame(loop);
        }
      }
      loop();
    }

    // --- ASAYİŞ & MANUEL BUZLAMA ---
    function toggleBrushMode() {
      isBrushMode = !isBrushMode;
      const txt = document.getElementById('brushBtnText');
      txt.innerText = isBrushMode ? 'Buzlama Aktif' : 'Manuel Fırça ile Buzla';
      canvas.classList.toggle('brush-active', isBrushMode);
    }

    function clearAllBlurs() {
      blurBoxes = [];
      document.getElementById('faceDetectStatus').innerText = "Temizlendi";
      render();
    }

    function initDragAndBrushEvents() {
      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
      };

      const onStart = (e) => {
        const p = getPos(e);
        if (isBrushMode) {
          const s = canvas.width * 0.10;
          blurBoxes.push({ x: p.x - (s/2), y: p.y - (s/2), w: s, h: s });
          render();
          return;
        }
        if (activeLogo && logoPos && Math.hypot(p.x - logoPos.x, p.y - logoPos.y) < 100) {
          isDragging = true; dragMode = 'logo'; dragStartX = p.x - logoPos.x; dragStartY = p.y - logoPos.y; return;
        }
        if (textPos && Math.hypot(p.x - textPos.x, p.y - textPos.y) < 180) {
          isDragging = true; dragMode = 'text'; dragStartX = p.x - textPos.x; dragStartY = p.y - textPos.y; return;
        }
        isDragging = true; dragMode = 'image'; dragStartX = p.x - imgPanX; dragStartY = p.y - imgPanY;
      };

      const onMove = (e) => {
        const p = getPos(e);
        if (isBrushMode && e.buttons === 1) {
          const s = canvas.width * 0.10;
          blurBoxes.push({ x: p.x - (s/2), y: p.y - (s/2), w: s, h: s });
          render();
          return;
        }
        if (!isDragging) return;
        if (dragMode === 'image') { imgPanX = p.x - dragStartX; imgPanY = p.y - dragStartY; render(); }
        else if (dragMode === 'logo') { logoPos = { x: p.x - dragStartX, y: p.y - dragStartY }; render(); }
        else if (dragMode === 'text') { textPos = { x: p.x - dragStartX, y: p.y - dragStartY }; render(); }
      };

      const onEnd = () => { isDragging = false; dragMode = null; };

      canvas.addEventListener('mousedown', onStart);
      canvas.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
      canvas.addEventListener('touchstart', onStart, { passive: true });
      canvas.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onEnd);
    }

    // --- KAN İZOLASYONU ---
    function applyBloodDesaturation(ctx, w, h) {
      try {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i+1], b = d[i+2];
          if (r > 85 && r > g * 1.30 && r > b * 1.30) {
            const gray = (r * 0.299 + g * 0.587 + b * 0.114);
            d[i] = gray; d[i+1] = gray; d[i+2] = gray;
          }
        }
        ctx.putImageData(imgData, 0, 0);
      } catch(e) {}
    }

    // --- KESİN PİKSEL BUZLAMA / MOZAİK ---
    function applyPixelatedBlur(ctx, w, h) {
      blurBoxes.forEach(box => {
        const startX = Math.max(0, Math.round(box.x));
        const startY = Math.max(0, Math.round(box.y));
        const blockW = Math.min(w - startX, Math.round(box.w));
        const blockH = Math.min(h - startY, Math.round(box.h));
        if (blockW <= 0 || blockH <= 0) return;

        try {
          const pixelSize = Math.max(12, Math.round(w * 0.025));
          const subData = ctx.getImageData(startX, startY, blockW, blockH);
          for (let py = 0; py < blockH; py += pixelSize) {
            for (let px = 0; px < blockW; px += pixelSize) {
              const pIdx = (py * blockW + px) * 4;
              const r = subData.data[pIdx], g = subData.data[pIdx+1], b = subData.data[pIdx+2];
              for (let dy = 0; dy < pixelSize && (py + dy) < blockH; dy++) {
                for (let dx = 0; dx < pixelSize && (px + dx) < blockW; dx++) {
                  const tIdx = ((py + dy) * blockW + (px + dx)) * 4;
                  subData.data[tIdx] = r; subData.data[tIdx+1] = g; subData.data[tIdx+2] = b;
                }
              }
            }
          }
          ctx.putImageData(subData, startX, startY);
        } catch(e) {}
      });
    }

    // --- GELİŞMİŞ DOĞAL NETLEŞTİRİCİ ---
    function applyNaturalSharpness(ctx, w, h, amount) {
      if (amount <= 0) return;
      try {
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const buff = new Uint8ClampedArray(data);
        const a = amount * 0.22;

        for (let y = 1; y < h - 1; y += 2) {
          for (let x = 1; x < w - 1; x += 2) {
            const idx = (y * w + x) * 4;
            for (let c = 0; c < 3; c++) {
              const val = buff[idx + c] * (1 + 4 * a) 
                        - buff[idx - 4 + c] * a 
                        - buff[idx + 4 + c] * a 
                        - buff[idx - w * 4 + c] * a 
                        - buff[idx + w * 4 + c] * a;
              data[idx + c] = Math.min(255, Math.max(0, val));
            }
          }
        }
        ctx.putImageData(imgData, 0, 0);
      } catch (e) {}
    }

    // --- LOGO ---
    function handleLogoUpload(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        let l = JSON.parse(localStorage.getItem('news_saved_logos') || '[]');
        l.unshift(ev.target.result);
        if (l.length > 8) l.pop();
        localStorage.setItem('news_saved_logos', JSON.stringify(l));
        loadSavedLogos();
        selectLogo(ev.target.result);
      };
      r.readAsDataURL(f);
    }

    function loadSavedLogos() {
      const l = JSON.parse(localStorage.getItem('news_saved_logos') || '[]');
      const c = document.getElementById('logoList');
      c.innerHTML = '';
      l.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'h-6 w-6 object-contain bg-slate-900 border border-slate-700 hover:border-red-500 rounded p-1 cursor-pointer';
        img.onclick = () => selectLogo(src);
        c.appendChild(img);
      });
    }

    function selectLogo(src) {
      const img = new Image();
      img.onload = () => { activeLogo = img; logoPos = null; render(); };
      img.src = src;
    }

    function setLogoCorner(corner) {
      const w = canvas.width, h = canvas.height, m = w * 0.04;
      const maxH = w * 0.042;
      const lW = activeLogo ? activeLogo.width * (maxH / activeLogo.height) : maxH;
      if (corner === 'top-right') logoPos = { x: w - m - lW, y: m };
      else if (corner === 'top-left') logoPos = { x: m, y: m };
      else if (corner === 'bottom-right') logoPos = { x: w - m - lW, y: h - m - maxH };
      else if (corner === 'bottom-left') logoPos = { x: m, y: h - m - maxH };
      render();
    }

    function drawDraggableMedia(ctx, source, w, targetH) {
      const sw = isVideoMode ? source.videoWidth : source.width;
      const sh = isVideoMode ? source.videoHeight : source.height;
      if (!sw || !sh) return;

      const zoom = parseFloat(document.getElementById('imgZoom')?.value || 1.0);
      const sRatio = sw / sh;
      const tRatio = w / targetH;
      let dw, dh;

      if (sRatio > tRatio) { dh = targetH * zoom; dw = dh * sRatio; }
      else { dw = w * zoom; dh = dw / sRatio; }

      const dx = (w - dw) / 2 + imgPanX;
      const dy = (targetH - dh) / 2 + imgPanY;
      ctx.drawImage(source, dx, dy, dw, dh);
    }

    // --- ANA RENDER MOTORU ---
    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const margin = w * 0.045;
      ctx.clearRect(0, 0, w, h);

      if (activeTab === 'tab-haber') {
        renderHaberModule(w, h, margin);
      } else if (activeTab === 'tab-piyasa') {
        renderPiyasaModule(w, h, margin);
      } else if (activeTab === 'tab-vefat') {
        renderVefatModule(w, h, margin);
      }
    }

    // 1. MANŞET & VİDEO ÇİZİMİ
    function renderHaberModule(w, h, margin) {
      const source = isVideoMode ? video : bgImage;
      const isStory = currentRatio === '9:16';

      if (isStory) {
        if (source) drawDraggableMedia(ctx, source, w, h);
        if (document.getElementById('bloodDesaturate')?.checked) applyBloodDesaturation(ctx, w, h);
        applyPixelatedBlur(ctx, w, h);

        const bGrad = ctx.createLinearGradient(0, h * 0.45, 0, h);
        bGrad.addColorStop(0, 'rgba(0,0,0,0)');
        bGrad.addColorStop(0.4, 'rgba(0,0,0,0.75)');
        bGrad.addColorStop(1, 'rgba(0,0,0,0.95)');
        ctx.fillStyle = bGrad;
        ctx.fillRect(0, 0, w, h);
        drawHeadlines(w, h, margin, false);
      } else {
        const bottomPanelH = Math.round(h * 0.30);
        const photoH = h - bottomPanelH;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w, photoH);
        ctx.clip();
        if (source) drawDraggableMedia(ctx, source, w, photoH);
        if (document.getElementById('bloodDesaturate')?.checked) applyBloodDesaturation(ctx, w, photoH);
        applyPixelatedBlur(ctx, w, photoH);
        ctx.restore();

        const panelGrad = ctx.createLinearGradient(0, photoH, 0, h);
        panelGrad.addColorStop(0, '#090d16');
        panelGrad.addColorStop(1, '#020617');
        ctx.fillStyle = panelGrad;
        ctx.fillRect(0, photoH, w, bottomPanelH);

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(0, photoH, w, w * 0.006);
        drawHeadlines(w, h, margin, true, photoH);
      }

      const sharp = parseFloat(document.getElementById('filterSharp')?.value || 0);
      if (sharp > 0 && !isVideoMode) applyNaturalSharpness(ctx, w, h, sharp);

      if (activeLogo) {
        ctx.save();
        const maxH = w * 0.042;
        const lW = activeLogo.width * (maxH / activeLogo.height);
        const lx = logoPos ? logoPos.x : w - margin - lW;
        const ly = logoPos ? logoPos.y : margin;
        ctx.drawImage(activeLogo, lx, ly, lW, maxH);
        ctx.restore();
      }
    }

    function drawHeadlines(w, h, margin, isSplit, splitY = 0) {
      const title = document.getElementById('titleText').value.trim();
      const spot = document.getElementById('spotText').value.trim();
      const drawX = textPos ? textPos.x : margin;

      if (isSplit && !textPos) {
        let curY = splitY + (w * 0.055);
        if (title) {
          ctx.save();
          const tSize = Math.round(w * 0.046);
          ctx.font = `900 ${tSize}px Montserrat`;
          ctx.fillStyle = titleColor;
          const lines = getLines(ctx, title, w - (margin * 2));
          lines.slice(0, 2).forEach(l => { ctx.fillText(l, drawX, curY); curY += tSize * 1.22; });
          ctx.restore();
        }
        if (spot) {
          ctx.save();
          const sSize = Math.round(w * 0.028);
          ctx.font = `500 ${sSize}px Montserrat`;
          ctx.fillStyle = '#cbd5e1';
          const lines = getLines(ctx, spot, w - (margin * 2));
          lines.slice(0, 2).forEach(l => { ctx.fillText(l, drawX, curY + (w * 0.01)); curY += sSize * 1.25; });
          ctx.restore();
        }
      } else {
        let curY = textPos ? textPos.y : h - margin;
        if (spot) {
          ctx.save();
          const sSize = Math.round(w * 0.032);
          ctx.font = `500 ${sSize}px Montserrat`;
          ctx.fillStyle = '#cbd5e1';
          ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 8;
          const lines = getLines(ctx, spot, w - (margin * 2));
          curY -= (lines.length * sSize * 1.3);
          let sY = curY;
          lines.forEach(l => { ctx.fillText(l, drawX, sY); sY += sSize * 1.3; });
          ctx.restore();
          curY -= (w * 0.02);
        }
        if (title) {
          ctx.save();
          const tSize = Math.round(w * 0.052);
          ctx.font = `900 ${tSize}px Montserrat`;
          ctx.fillStyle = titleColor;
          ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10;
          const lines = getLines(ctx, title, w - (margin * 2));
          curY -= (lines.length * tSize * 1.2);
          let tY = curY;
          lines.forEach(l => { ctx.fillText(l, drawX, tY); tY += tSize * 1.2; });
          ctx.restore();
        }
      }
    }

    // 2. ALTIN & DÖVİZ MODÜLÜ
    function renderPiyasaModule(w, h, margin) {
      const isVertical = h > w;
      const bgGrad = ctx.createRadialGradient(w * 0.7, h * 0.7, 50, w / 2, h / 2, Math.max(w, h));
      bgGrad.addColorStop(0, '#1c1409');
      bgGrad.addColorStop(0.5, '#0d0905');
      bgGrad.addColorStop(1, '#050403');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const t1 = document.getElementById('marketTitle1').value.trim();
      const t2 = document.getElementById('marketTitle2').value.trim();

      ctx.save();
      const topH = isVertical ? h * 0.20 : h * 0.28;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 ${Math.round(isVertical ? w * 0.065 : h * 0.09)}px Montserrat`;
      ctx.textAlign = 'left';
      ctx.fillText(t1, margin, topH * 0.45);

      if (t2) {
        const grad = ctx.createLinearGradient(margin, 0, w * 0.7, 0);
        grad.addColorStop(0, '#ef4444');
        grad.addColorStop(1, '#f97316');
        ctx.fillStyle = grad;
        ctx.font = `900 ${Math.round(isVertical ? w * 0.075 : h * 0.11)}px 'Poppins', Montserrat`;
        ctx.fillText(t2, margin, topH * 0.85);
      }

      ctx.font = `900 ${Math.round(isVertical ? w * 0.06 : h * 0.10)}px Montserrat`;
      ctx.fillText('📉', w - margin - (isVertical ? 40 : 60), topH * 0.75);
      ctx.restore();

      const panelY = topH + (h * 0.02);
      const panelH = h - panelY - (isVertical ? h * 0.10 : h * 0.08);
      ctx.fillStyle = 'rgba(10, 10, 12, 0.82)';
      ctx.fillRect(margin, panelY, w - (margin * 2), panelH);

      ctx.fillStyle = '#d97706';
      ctx.fillRect(margin, panelY, w * 0.008, panelH);

      const items = [
        { name: 'GRAM ALTIN', val: document.getElementById('p_gram').value, icon: '🏆', gold: true },
        { name: 'ÇEYREK ALTIN', val: document.getElementById('p_ceyrek').value, icon: '🟡', gold: true },
        { name: 'YARIM / TAM', val: document.getElementById('p_yarim').value, icon: '🪙', gold: true },
        { name: '22 AYAR BİLEZİK', val: document.getElementById('p_bilezik').value, icon: '✨', gold: true },
        { name: 'DOLAR ($)', val: document.getElementById('p_dolar').value, icon: '💵', gold: false },
        { name: 'EURO (€)', val: document.getElementById('p_euro').value, icon: '💶', gold: false }
      ];

      const rowH = panelH / items.length;
      items.forEach((item, i) => {
        const ry = panelY + (i * rowH);
        if (i > 0) {
          ctx.strokeStyle = 'rgba(255,255,255,0.06)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(margin + 15, ry);
          ctx.lineTo(w - margin - 15, ry);
          ctx.stroke();
        }
        ctx.fillStyle = '#e2e8f0';
        ctx.font = `600 ${Math.round(isVertical ? w * 0.034 : h * 0.045)}px Montserrat`;
        ctx.textAlign = 'left';
        ctx.fillText(`${item.icon} ${item.name}`, margin + (w * 0.04), ry + (rowH * 0.58));

        ctx.fillStyle = item.gold ? '#fbbf24' : '#34d399';
        ctx.font = `800 ${Math.round(isVertical ? w * 0.038 : h * 0.048)}px Montserrat`;
        ctx.textAlign = 'right';
        ctx.fillText(item.val, w - margin - (w * 0.04), ry + (rowH * 0.58));
      });
    }

    // 3. VEFAT LİSTESİ
    function renderVefatModule(w, h, margin) {
      const isVertical = h > w;
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#0c1322');
      bg.addColorStop(0.4, '#1e293b');
      bg.addColorStop(0.8, '#152e28');
      bg.addColorStop(1, '#0a1714');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const topH = isVertical ? h * 0.22 : h * 0.32;
      const headGrad = ctx.createLinearGradient(0, 0, 0, topH);
      headGrad.addColorStop(0, 'rgba(0, 0, 0, 0.95)');
      headGrad.addColorStop(0.8, 'rgba(5, 8, 15, 0.85)');
      headGrad.addColorStop(1, 'rgba(5, 8, 15, 0)');
      ctx.fillStyle = headGrad;
      ctx.fillRect(0, 0, w, topH);

      const h1 = document.getElementById('vefatHead1').value.trim();
      const h2 = document.getElementById('vefatHead2').value.trim();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 10;

      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 ${Math.round(isVertical ? w * 0.065 : h * 0.085)}px 'Poppins', Montserrat`;
      ctx.fillText(h1, w / 2, topH * 0.40);

      ctx.fillStyle = '#FFC700';
      ctx.font = `900 ${Math.round(isVertical ? w * 0.082 : h * 0.105)}px 'Poppins', Montserrat`;
      ctx.fillText(h2, w / 2, topH * 0.78);
      ctx.restore();

      const panelY = topH + (h * 0.02);
      const panelH = h - panelY - (h * 0.04);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
      ctx.fillRect(margin, panelY, w - (margin * 2), panelH);

      ctx.fillStyle = '#FFC700';
      ctx.fillRect(margin, panelY, w - (margin * 2), 2);

      const raw = document.getElementById('vefatListText').value.trim();
      const items = raw.split('\n').filter(i => i.trim() !== '');
      const rowH = panelH / Math.max(items.length, 3);

      items.forEach((item, idx) => {
        const ry = panelY + (idx * rowH);
        const parts = item.split(' - ');
        const namePart = parts[0] || item;
        const detailPart = parts[1] || '';

        if (idx > 0) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(margin + 15, ry);
          ctx.lineTo(w - margin - 15, ry);
          ctx.stroke();
        }

        if (isVertical) {
          ctx.fillStyle = '#FFFFFF';
          ctx.font = `bold ${Math.round(w * 0.038)}px Montserrat`;
          ctx.textAlign = 'left';
          ctx.fillText(`🥀 ${namePart}`, margin + (w * 0.04), ry + (rowH * 0.42));

          if (detailPart) {
            ctx.fillStyle = '#94a3b8';
            ctx.font = `500 ${Math.round(w * 0.030)}px Montserrat`;
            ctx.textAlign = 'left';
            ctx.fillText(`📍 ${detailPart}`, margin + (w * 0.04), ry + (rowH * 0.78));
          }
        } else {
          ctx.fillStyle = '#FFFFFF';
          ctx.font = `bold ${Math.round(h * 0.042)}px Montserrat`;
          ctx.textAlign = 'left';
          ctx.fillText(`🥀 ${namePart}`, margin + (w * 0.03), ry + (rowH * 0.52));

          if (detailPart) {
            ctx.fillStyle = '#94a3b8';
            ctx.font = `500 ${Math.round(h * 0.034)}px Montserrat`;
            ctx.textAlign = 'right';
            ctx.fillText(`📍 ${detailPart}`, w - margin - (w * 0.03), ry + (rowH * 0.52));
          }
        }
      });
    }

    function getLines(ctx, text, maxW) {
      const words = text.split(' '); const lines = []; let line = words[0];
      for (let i = 1; i < words.length; i++) {
        const test = line + " " + words[i];
        if (ctx.measureText(test).width < maxW) line = test;
        else { lines.push(line); line = words[i]; }
      }
      lines.push(line); return lines;
    }

    // --- VİDEO KAYIT ---
    function toggleVideoExport() {
      if (!isRecording) startRecording();
      else stopRecording();
    }

    function startRecording() {
      recordedChunks = [];
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `medya-video-${Date.now()}.mp4`;
        a.click();
        document.getElementById('recordBtnText').innerText = "Videoyu Kaydet (MP4)";
        document.getElementById('btnRecordVideo').classList.remove('bg-red-600');
        document.getElementById('btnRecordVideo').classList.add('bg-purple-600');
      };

      video.currentTime = videoStartTime;
      video.play();
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('recordBtnText').innerText = "🔴 Kaydediliyor... (Durdur)";
      document.getElementById('btnRecordVideo').classList.remove('bg-purple-600');
      document.getElementById('btnRecordVideo').classList.add('bg-red-600');
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
      }
    }

    // --- ÇIKTI ALMA ---
    function downloadFormat(fmt) {
      const a = document.createElement('a');
      a.download = `medya-${currentRatio}-${Date.now()}.${fmt}`;
      a.href = canvas.toDataURL(`image/${fmt}`, fmt === 'webp' ? 0.92 : 1.0);
      a.click();
    }

    async function downloadAllSizesZip() {
      const zip = new JSZip();
      const ratios = ['1:1', '9:16', '16:9', 'kapak'];
      const originalRatio = currentRatio;
      for (const r of ratios) {
        setRatio(r);
        render();
        const dataUrl = canvas.toDataURL('image/png', 1.0);
        zip.file(`kart-${r}.png`, dataUrl.replace(/^data:image\/png;base64,/, ""), { base64: true });
      }
      setRatio(originalRatio);
      const content = await zip.generateAsync({ type: "blob" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = `tum-boyutlar-${Date.now()}.zip`;
      a.click();
    }
  </script>
