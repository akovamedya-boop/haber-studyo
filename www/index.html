<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medya Süper Stüdyo PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    .brush-active { cursor: crosshair !important; }
    .tab-active { background-color: #dc2626 !important; color: #ffffff !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col select-none">

  <!-- ÜST HEADER BAR -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-red-600/20 p-2 rounded-lg border border-red-600/40">
        <i class="ph-bold ph-broadcast text-red-500 text-xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm lg:text-base tracking-wide flex items-center gap-2">
          <span>Medya Süper Stüdyo</span>
          <span class="text-[10px] bg-red-600 text-white font-bold px-2 py-0.5 rounded-full">v4 ULTIMATE</span>
        </h1>
        <p class="text-[10px] text-slate-400">Haber Masası & Günlük Otomasyon Merkezi</p>
      </div>
    </div>

    <!-- Hızlı Çıktı Butonları -->
    <div class="flex items-center gap-2">
      <button onclick="downloadFormat('webp')" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-1 transition" title="Web Siteleri İçin WebP">
        <i class="ph-bold ph-lightning"></i>
        <span>WebP</span>
      </button>

      <button onclick="downloadAllSizesZip()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-1.5 transition">
        <i class="ph-bold ph-file-zip text-sm"></i>
        <span class="hidden sm:inline">Zip (Tümü)</span>
      </button>

      <button onclick="downloadFormat('png')" class="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-lg shadow-red-600/30 text-xs transition">
        <i class="ph-bold ph-download-simple text-sm"></i>
        <span>Görsel İndir</span>
      </button>
    </div>
  </header>

  <!-- ANA GÖVDE -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">

    <!-- SOL: KONTROL MENÜSÜ -->
    <div class="w-full lg:w-[420px] bg-slate-900 border-r border-slate-800 flex flex-col h-[52vh] lg:h-[calc(100vh-61px)]">
      
      <!-- MODÜL SEKMELERİ -->
      <div class="flex overflow-x-auto border-b border-slate-800 bg-slate-950 p-1.5 gap-1 text-xs font-semibold">
        <button onclick="switchTab('tab-haber')" id="btn-tab-haber" class="tab-btn tab-active px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-newspaper"></i> Manşet
        </button>
        <button onclick="switchTab('tab-piyasa')" id="btn-tab-piyasa" class="tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-coins text-amber-400"></i> Altın/Döviz
        </button>
        <button onclick="switchTab('tab-vefat')" id="btn-tab-vefat" class="tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-flower-tulip"></i> Vefat Listesi
        </button>
        <button onclick="switchTab('tab-karsilastir')" id="btn-tab-karsilastir" class="tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-columns"></i> Öncesi/Sonrası
        </button>
        <button onclick="switchTab('tab-ihbar')" id="btn-tab-ihbar" class="tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0">
          <i class="ph ph-whatsapp-logo"></i> İhbar Hattı
        </button>
      </div>

      <!-- SEKME İÇERİKLERİ -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4">

        <!-- 1. HABER / MANŞET MODÜLÜ -->
        <div id="tab-haber" class="tab-content space-y-4">
          <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Haber Fotoğrafı</label>
            <input type="file" id="mediaUploadImg" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            <button onclick="document.getElementById('mediaUploadImg').click()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-xs font-medium flex items-center justify-center gap-1.5">
              <i class="ph ph-image text-red-400"></i> Fotoğraf Seç
            </button>
          </div>

          <div class="p-3 bg-red-950/30 border border-red-900/60 rounded-lg space-y-2">
            <div class="flex items-center justify-between bg-slate-900/90 p-2 rounded border border-slate-800 text-xs">
              <span class="text-slate-300">Kan/Kırmızı Renk İzolasyonu (Gri Yap)</span>
              <input type="checkbox" id="bloodDesaturate" class="accent-red-500 w-4 h-4 cursor-pointer" onchange="render()">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="autoBlurFaces()" class="py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-xs font-medium text-amber-300 flex items-center justify-center gap-1">
                <i class="ph-bold ph-user-focus"></i> Yüzleri Buzla
              </button>
              <button onclick="toggleBrushMode()" id="brushBtn" class="py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-xs font-medium flex items-center justify-center gap-1">
                <i class="ph-bold ph-paint-brush"></i> <span id="brushBtnText">Plaka Fırçası</span>
              </button>
            </div>
          </div>

          <div class="space-y-2">
            <textarea id="titleText" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs font-bold focus:border-red-500 outline-none resize-none" placeholder="Haber Başlığı..." oninput="render()">MANİSA'DA ELEKTRİK KESİNTİSİ YAŞANACAK</textarea>
            <textarea id="spotText" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-300 focus:border-red-500 outline-none resize-none" placeholder="Spot / Açıklama..." oninput="render()">Planlı bakım çalışmaları kapsamında Yunusemre ve Şehzadeler ilçelerinde gün boyu kesinti uygulanacak.</textarea>
          </div>
        </div>

        <!-- 2. PİYASA MODÜLÜ -->
        <div id="tab-piyasa" class="tab-content hidden space-y-3">
          <div class="bg-slate-950 p-3 rounded-lg border border-amber-900/40 space-y-3">
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Gram Altın</span>
                <input type="text" id="p_gram" value="3.450 / 3.490" class="w-full bg-transparent font-bold text-amber-400 outline-none" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Çeyrek Altın</span>
                <input type="text" id="p_ceyrek" value="5.620 / 5.710" class="w-full bg-transparent font-bold text-amber-400 outline-none" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Dolar ($)</span>
                <input type="text" id="p_dolar" value="38.45 / 38.65" class="w-full bg-transparent font-bold text-emerald-400 outline-none" oninput="render()">
              </div>
              <div class="bg-slate-900 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[10px]">Euro (€)</span>
                <input type="text" id="p_euro" value="41.20 / 41.45" class="w-full bg-transparent font-bold text-emerald-400 outline-none" oninput="render()">
              </div>
            </div>
            <input type="text" id="marketTitle" value="GÜNCEL MANİSA ALTIN & DÖVİZ" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs font-bold text-slate-200" oninput="render()">
          </div>
        </div>

        <!-- 3. VEFAT MODÜLÜ -->
        <div id="tab-vefat" class="tab-content hidden space-y-3">
          <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2">
            <textarea id="vefatListText" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-mono text-slate-200 outline-none" oninput="render()">Ahmet Yılmaz (74) - Şehzadeler / Hatuniye Camii
Fatma Demir (68) - Yunusemre / Laleli Camii
Mehmet Kaya (81) - Turgutlu / Pazar Camii</textarea>
            <input type="text" id="vefatDateText" value="BUGÜN MANİSA'DA VEFAT EDENLER" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-center font-bold text-amber-400" oninput="render()">
          </div>
        </div>

        <!-- 4. DİĞERLERİ -->
        <div id="tab-karsilastir" class="tab-content hidden space-y-3">
          <input type="text" id="compareTitle" value="TARİHİ ÇARŞI RESTORASYONU" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs font-bold" oninput="render()">
        </div>
        <div id="tab-ihbar" class="tab-content hidden space-y-3">
          <input type="text" id="ihbarLocation" value="Şehzadeler / İzmir Caddesi" placeholder="Olay Yeri" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs" oninput="render()">
        </div>

        <!-- ORTAK AYARLAR -->
        <div class="border-t border-slate-800 pt-3 space-y-3">
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Boyut</label>
            <div class="grid grid-cols-4 gap-1.5">
              <button onclick="setRatio('1:1')" id="btn-1:1" class="ratio-btn bg-red-600 text-white py-1.5 rounded text-xs font-semibold flex flex-col items-center"><span>1:1</span></button>
              <button onclick="setRatio('9:16')" id="btn-9:16" class="ratio-btn bg-slate-800 text-slate-300 py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-slate-700"><span>9:16</span></button>
              <button onclick="setRatio('16:9')" id="btn-16:9" class="ratio-btn bg-slate-800 text-slate-300 py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-slate-700"><span>16:9</span></button>
              <button onclick="setRatio('4:5')" id="btn-4:5" class="ratio-btn bg-slate-800 text-slate-300 py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-slate-700"><span>4:5</span></button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- SAĞ: ÖNİZLEME TUVALİ -->
    <div class="flex-1 bg-slate-950 p-4 flex flex-col items-center justify-center overflow-auto relative">
      <canvas id="previewCanvas" class="rounded-lg shadow-2xl max-w-full max-h-[75vh] object-contain border border-slate-800"></canvas>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    let activeTab = 'tab-haber';
    let currentRatio = '1:1';
    let bgImage = null;
    let blurZones = [];
    let isBrushMode = false;
    let isDrawing = false;

    const DIMENSIONS = {
      '1:1': { width: 1080, height: 1080 },
      '9:16': { width: 1080, height: 1920 },
      '16:9': { width: 1920, height: 1080 },
      '4:5': { width: 1080, height: 1350 }
    };

    window.onload = () => {
      initCanvasEvents();
      createDefaultPlaceholder();
    };

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.className = 'tab-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 shrink-0');
      document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
      document.getElementById(`btn-${tabId}`).className = 'tab-btn tab-active px-3 py-1.5 rounded flex items-center gap-1 shrink-0';
      document.getElementById(tabId).classList.remove('hidden');
      render();
    }

    function createDefaultPlaceholder() {
      const temp = document.createElement('canvas');
      temp.width = 1080; temp.height = 1080;
      const tCtx = temp.getContext('2d');
      tCtx.fillStyle = '#0f172a';
      tCtx.fillRect(0, 0, 1080, 1080);
      tCtx.fillStyle = '#475569';
      tCtx.font = 'bold 36px Montserrat';
      tCtx.textAlign = 'center';
      tCtx.fillText('Görsel Yükleyin', 540, 540);
      const img = new Image();
      img.src = temp.toDataURL();
      img.onload = () => { bgImage = img; setRatio('1:1'); };
    }

    function setRatio(ratio) {
      currentRatio = ratio;
      document.querySelectorAll('.ratio-btn').forEach(btn => btn.className = 'ratio-btn bg-slate-800 text-slate-300 py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-slate-700');
      document.getElementById(`btn-${ratio}`).className = 'ratio-btn bg-red-600 text-white py-1.5 rounded text-xs font-semibold flex flex-col items-center border border-transparent';
      canvas.width = DIMENSIONS[ratio].width;
      canvas.height = DIMENSIONS[ratio].height;
      render();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => { bgImage = img; blurZones = []; render(); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function toggleBrushMode() {
      isBrushMode = !isBrushMode;
      document.getElementById('brushBtnText').innerText = isBrushMode ? 'Buzlama Aktif' : 'Plaka Fırçası';
      canvas.classList.toggle('brush-active', isBrushMode);
    }

    function autoBlurFaces() {
      blurZones.push({ x: canvas.width * 0.5, y: canvas.height * 0.38, r: canvas.width * 0.12 });
      render();
    }

    function initCanvasEvents() {
      const getPos = e => {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
      };
      canvas.addEventListener('mousedown', e => { if (!isBrushMode) return; isDrawing = true; const p = getPos(e); blurZones.push({ x: p.x, y: p.y, r: canvas.width * 0.045 }); render(); });
      canvas.addEventListener('mousemove', e => { if (!isBrushMode || !isDrawing) return; const p = getPos(e); blurZones.push({ x: p.x, y: p.y, r: canvas.width * 0.045 }); render(); });
      window.addEventListener('mouseup', () => isDrawing = false);
    }

    function render() {
      const w = canvas.width, h = canvas.height, margin = w * 0.05;
      ctx.clearRect(0, 0, w, h);

      if (activeTab === 'tab-piyasa') {
        ctx.fillStyle = '#090d16'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#d97706'; ctx.fillRect(margin, margin, w - margin*2, w * 0.12);
        ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(w * 0.04)}px Montserrat`; ctx.textAlign = 'center';
        ctx.fillText(document.getElementById('marketTitle').value, w/2, margin + w*0.075);
      } else if (activeTab === 'tab-vefat') {
        ctx.fillStyle = '#0b0f19'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#d97706'; ctx.font = `bold ${Math.round(w * 0.04)}px Montserrat`; ctx.textAlign = 'center';
        ctx.fillText(document.getElementById('vefatDateText').value, w/2, margin*2);
      } else {
        if (bgImage) ctx.drawImage(bgImage, 0, 0, w, h);
        const bGrad = ctx.createLinearGradient(0, h * 0.4, 0, h);
        bGrad.addColorStop(0, 'rgba(0,0,0,0)'); bGrad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = bGrad; ctx.fillRect(0, 0, w, h);

        const title = document.getElementById('titleText').value;
        if (title) {
          ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(w * 0.06)}px Montserrat`;
          ctx.fillText(title, margin, h - margin);
        }
      }
    }

    function downloadFormat(fmt) {
      const a = document.createElement('a');
      a.download = `medya-${Date.now()}.${fmt}`;
      a.href = canvas.toDataURL(`image/${fmt}`);
      a.click();
    }
  </script>
</body>
</html>
